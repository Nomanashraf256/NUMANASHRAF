<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English–Turkish Connect</title>
<link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/app.js">
</script>
</head>
<body>
<header class="top">
<b>
<span class="mark">↔</span> English–Turkish Connect</b>
<select id="locale" aria-label="Language">
<option value="en">I speak English</option>
<option value="tr">Türkçe konuşuyorum</option>
</select>
</header>
<main>
<details id="appearance"><summary>◈ <span data-t="appearance"></span></summary>
<label><span data-t="wallpaper"></span><select id="wallpaper">
<option value="studio" data-t="studio"></option><option value="custom" data-t="custom"></option><option value="auto" data-t="rotate"></option><option value="istanbul">Istanbul</option><option value="coast">Antalya</option><option value="london">London</option><option value="aurora">Aurora</option><option value="solid" data-t="solid"></option>
</select></label><button id="shuffle" type="button" data-t="shuffle"></button>
<label><span data-t="theme"></span><select id="theme"><option value="light" data-t="light"></option><option value="dark" data-t="dark"></option></select></label>
<button id="wallpaperPick" type="button" data-t="wallpaperPick"></button>
<input id="wallpaperFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
</details>
<section id="lobby">
<span class="mark hero">↔</span>
<h1 data-t="title">
</h1>
<p data-t="intro">
</p>
<div class="entry">
<button class="primary" id="create" data-t="create">
</button>
<form id="join">
<label for="code" data-t="inviteLabel">
</label>
<div class="row">
<input id="code" required maxlength="500" autocomplete="off" autocapitalize="off" spellcheck="false">
<button data-t="join">
</button>
</div>
</form>
</div>
</section>
<section id="room" hidden>
<header class="room-head">
<div>
<h2 data-t="room">
</h2>
<p id="presence">
</p>
</div>
<div class="row">
<button id="copy" data-t="copy">
</button>
<button id="leave" data-t="leave">
</button>
<button id="call" class="primary" data-t="call">
</button>
</div>
</header>
<div id="callPanel" hidden>
<div class="room-head">
<div>
<span id="quality" role="status"></span> <time id="callTime"></time> <strong id="callState">
</strong>
<p id="callNotice" role="status">
</p>
</div>
<div class="row">
<button id="accept" class="primary" data-t="accept">
</button>
<button id="decline" class="danger" data-t="decline">
</button>
<button id="mute" data-t="mute">
</button>
<button id="end" class="danger" data-t="end">
</button>
</div>
</div>
<div id="callTools" hidden>
<div class="row options">
<label>
<span data-t="listenMode">
</span>
<select id="hear">
<option value="translated" data-t="translated">
</option>
<option value="original" data-t="original">
</option>
<option value="captions" data-t="captionsOnly"></option>
<option value="both" data-t="both">
</option>
</select>
</label>
<label>
<span data-t="captureMode">
</span>
<select id="capture">
<option value="auto" data-t="auto">
</option>
<option value="push" data-t="push">
</option>
</select>
</label>
<label><span data-t="speed"></span><select id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label>
<label><span data-t="originalVolume"></span><input id="originalVolume" type="range" min="0" max="1" step="0.1" value="1"></label>
<label><span data-t="translatedVolume"></span><input id="translatedVolume" type="range" min="0" max="1" step="0.1" value="1"></label>
<button id="replay" type="button" data-t="replay" disabled></button>
<button id="phrase" class="primary" hidden>
</button>
</div>
<div id="captions" role="log">
</div>
</div>
</div>
<details class="chat-settings"><summary data-t="chatSettings"></summary><div class="chat-tools">
<label><input type="checkbox" id="dual"><span data-t="dual"></span></label>
<label><input type="checkbox" id="previewToggle"><span data-t="previewToggle"></span></label>
</div>
<div class="room-search"><input type="search" id="search" maxlength="120"></div>
</details>
<div id="messages" role="log">
</div>
<div class="composer">
<p id="upgradeStatus" role="status"></p>
<p id="recordStatus" role="status">
</p>
<p id="typingStatus" role="status"></p>
<div id="preview" role="status" hidden></div>
<div class="composer-tools">
<details id="quick"><summary data-t="quick"></summary><div id="quickItems"></div></details>
<details id="emojiPicker">
<summary data-t="emoji"></summary>
<input id="emojiSearch" type="search" maxlength="40">
<div id="emojiTabs" class="emoji-tabs"></div>
<div id="emojiGrid" class="emoji-grid"></div>
</details></div>
<div id="replyBanner" hidden><span id="replyLabel"></span><button type="button" id="cancelReply" data-t="cancel"></button></div>
<div id="attachment" hidden><span id="attachmentName"></span><button id="cancelAttachment" type="button" data-t="cancel"></button></div>
<input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" hidden>
<form class="row" id="compose">
<button id="attach" type="button" data-t="attach"></button>
<button id="mic" type="button" data-t="record">
</button>
<input id="draft" maxlength="1500" autocomplete="off">
<button class="primary" id="send" data-t="send">
</button>
</form>
</div>
</section>
<p id="notice" role="status">
</p>
</main>
<footer data-t="footer">
</footer>
<audio id="peerAudio" autoplay playsinline>
</audio>
<audio id="spokenAudio" playsinline>
</audio>
</body>
</html>
